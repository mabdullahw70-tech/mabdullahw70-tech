<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-label="Floating astronaut" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
      @keyframes float { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(4deg); } }
      @keyframes shoot { 0% { transform: translate(0,0); opacity: 0; } 8% { opacity: 1; } 30% { transform: translate(-170px,95px); opacity: 0; } 100% { transform: translate(-170px,95px); opacity: 0; } }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
      @keyframes tether { to { stroke-dashoffset: -48; } }
      .s { fill: #fff; animation: tw 3s ease-in-out infinite; }
      .astro { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .shoot { animation: shoot 7s linear infinite; }
      .led { fill: #fff; animation: blink 1.4s ease-in-out infinite; }
      .tether { fill: none; stroke: #8a8a8a; stroke-width: 2; stroke-dasharray: 6 6; animation: tether 1.5s linear infinite; }
    </style>
  </defs>

  <rect width="360" height="300" rx="10" fill="#000"/>

  <circle class="s" cx="30"  cy="40"  r="1.4" style="animation-delay:0s"/>
  <circle class="s" cx="70"  cy="120" r="1"   style="animation-delay:.6s"/>
  <circle class="s" cx="120" cy="30"  r="1.2" style="animation-delay:1.2s"/>
  <circle class="s" cx="200" cy="25"  r="1"   style="animation-delay:.3s"/>
  <circle class="s" cx="250" cy="70"  r="1.5" style="animation-delay:1.8s"/>
  <circle class="s" cx="320" cy="30"  r="1.2" style="animation-delay:.9s"/>
  <circle class="s" cx="335" cy="125" r="1"   style="animation-delay:2.1s"/>
  <circle class="s" cx="300" cy="190" r="1.3" style="animation-delay:.4s"/>
  <circle class="s" cx="340" cy="250" r="1"   style="animation-delay:1.5s"/>
  <circle class="s" cx="260" cy="272" r="1.2" style="animation-delay:2.4s"/>
  <circle class="s" cx="190" cy="285" r="1"   style="animation-delay:.7s"/>
  <circle class="s" cx="100" cy="268" r="1.4" style="animation-delay:1.1s"/>
  <circle class="s" cx="40"  cy="220" r="1"   style="animation-delay:1.9s"/>
  <circle class="s" cx="25"  cy="160" r="1.3" style="animation-delay:.2s"/>
  <circle class="s" cx="60"  cy="75"  r=".9"  style="animation-delay:2.6s"/>
  <circle class="s" cx="150" cy="68"  r="1"   style="animation-delay:.5s"/>
  <circle class="s" cx="232" cy="232" r=".9"  style="animation-delay:1.3s"/>
  <circle class="s" cx="290" cy="150" r=".9"  style="animation-delay:2.2s"/>
  <circle class="s" cx="90"  cy="190" r="1"   style="animation-delay:.8s"/>

  <circle cx="300" cy="78" r="22" fill="#161616" stroke="#3a3a3a"/>
  <circle cx="293" cy="72" r="4" fill="#222"/>
  <circle cx="308" cy="86" r="5" fill="#222"/>
  <circle cx="305" cy="68" r="2.5" fill="#222"/>

  <g class="shoot">
    <line x1="330" y1="42" x2="352" y2="29" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <g class="astro">
    <path class="tether" d="M152 162 C 110 172 90 232 30 252"/>

    <rect x="148" y="118" width="84" height="92" rx="16" fill="#9a9a9a"/>

    <rect x="160" y="196" width="24" height="46" rx="11" fill="#e6e6e6"/>
    <rect x="190" y="196" width="24" height="46" rx="11" fill="#e6e6e6"/>
    <rect x="158" y="230" width="28" height="16" rx="7" fill="#7a7a7a"/>
    <rect x="188" y="230" width="28" height="16" rx="7" fill="#7a7a7a"/>

    <rect x="128" y="132" width="22" height="58" rx="11" fill="#eaeaea" transform="rotate(18 139 135)"/>
    <rect x="230" y="132" width="22" height="58" rx="11" fill="#eaeaea" transform="rotate(-24 241 135)"/>
    <circle cx="122" cy="187" r="12" fill="#8a8a8a"/>
    <circle cx="263" cy="185" r="12" fill="#8a8a8a"/>

    <rect x="156" y="124" width="68" height="84" rx="26" fill="#f4f4f4"/>
    <rect x="172" y="146" width="36" height="22" rx="5" fill="#2a2a2a"/>
    <circle class="led" cx="180" cy="157" r="3"/>
    <circle class="led" cx="190" cy="157" r="3" style="animation-delay:.4s"/>
    <circle class="led" cx="200" cy="157" r="3" style="animation-delay:.8s"/>

    <circle cx="190" cy="100" r="42" fill="#f7f7f7" stroke="#cfcfcf" stroke-width="3"/>
    <ellipse cx="190" cy="102" rx="30" ry="25" fill="#0d0d0d" stroke="#6b6b6b" stroke-width="2"/>
    <text x="190" y="108" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#fff" opacity=".85">&lt;/&gt;</text>
    <ellipse cx="179" cy="91" rx="10" ry="6" fill="#fff" opacity=".4" transform="rotate(-25 179 91)"/>
  </g>
</svg>
