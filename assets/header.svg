<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="Welcome to Abdullah's GitHub" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e5e5e5"/>
      <stop offset="1" stop-color="#e5e5e5" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="typed">
      <rect x="150" y="50" height="80" width="0">
        <animate attributeName="width" from="0" to="700" dur="3.2s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
    <style>
      @keyframes tw { 0%,100% { opacity: .1; } 50% { opacity: 1; } }
      @keyframes shoot { 0% { transform: translate(0,0); opacity: 0; } 5% { opacity: 1; } 20% { transform: translate(-280px,140px); opacity: 0; } 100% { transform: translate(-280px,140px); opacity: 0; } }
      @keyframes flow { to { stroke-dashoffset: -40; } }
      @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(16px); } }
      .s { fill: #fff; animation: tw 3s ease-in-out infinite; }
      .sh { animation: shoot 9s linear infinite; }
      .sh2 { animation: shoot 13s linear infinite; animation-delay: 4s; }
      .river { fill: none; stroke: url(#river); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 12 8; animation: flow 2s linear infinite; }
      .d2 { animation: drift 9s ease-in-out infinite; }
    </style>
  </defs>

