<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 4" preserveAspectRatio="none" width="800" height="4" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8b8b8b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b8b8b"/>
      <stop offset="1" stop-color="#8b8b8b" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes slide { from { transform: translateX(-220px); } to { transform: translateX(800px); } }
      .m { animation: slide 3.2s ease-in-out infinite; }
    </style>
  </defs>
  <rect y="1" width="800" height="2" fill="#6b6b6b" opacity="0.3"/>
  <rect class="m" width="220" height="4" fill="url(#g)"/>
